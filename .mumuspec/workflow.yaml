# MumuSpec 项目级 workflow override（CHG-7 dogfood，2026-09-05）
# 本文件由 activateProjectWorkflow() 在 guard 入口加载；存在且合法即生效（source 'project'）。
# 当前内容与 src/change/workflow.default.yaml（CHG-6 单一事实源）保持一致——
# 优先启用加载路径本身；项目需要差异化流程（如裁剪 BP、调整回退边）时在此修改，
# 损坏/非法时 loader 会 WARN 并回退内置默认。
# 注意：phases 顺序须与 phase-graph.ts 的 PHASE_ORDER 保持同构（AC-01 测试锁定）。

version: 1

phases:
  - open
  - design
  - build
  - verify
  - archive-in-progress
  - archive-completed
  - discarded

terminal:
  - archive-completed
  - discarded

edges:
  # ── forward（progress）──
  - from: open
    to: design
    direction: forward
    countAs: none
    label: open→design（完整工作流）
    bp: { id: BP-3, description: 工件审查与确认, required: true }
  - from: design
    to: build
    direction: forward
    countAs: none
    label: design→build
    bp: { id: BP-4, description: 设计方案确认, required: true }
  - from: build
    to: verify
    direction: forward
    countAs: none
    label: build→verify
  - from: verify
    to: archive-in-progress
    direction: forward
    countAs: none
    label: verify→archive-in-progress
    bp: { id: BP-17, description: 归档最终确认, required: true }
  - from: archive-in-progress
    to: archive-completed
    direction: forward
    countAs: none
    label: archive→completed

  # ── skip（conditional shortcut：hotfix/tweak 跳过 design）──
  - from: open
    to: build
    direction: skip
    countAs: none
    label: open→build（hotfix/tweak 跳过 design）
    bp: { id: BP-3, description: 工件审查与确认（预设路径）, required: true }
    condition:
      workflow_in: [hotfix, tweak]

  # ── backward（rollback/rework — creates cycles）──
  - from: build
    to: design
    direction: backward
    countAs: rollback
    label: build→design（回退重设）
  - from: verify
    to: design
    direction: backward
    countAs: rollback
    label: verify→design（设计层面重做）
  - from: verify
    to: build
    direction: backward
    countAs: rebuild
    label: verify→build（仅修复/重建）
  - from: archive-in-progress
    to: build
    direction: backward
    countAs: rollback
    label: archive→build（CI 失败回退）

  # ── terminal（discarded）──
  - from: open
    to: discarded
    direction: skip
    countAs: none
    label: open→discarded（废弃变更）
  - from: design
    to: discarded
    direction: skip
    countAs: none
    label: design→discarded（废弃变更）
  - from: build
    to: discarded
    direction: skip
    countAs: none
    label: build→discarded（废弃变更）
  - from: verify
    to: discarded
    direction: skip
    countAs: none
    label: verify→discarded（废弃变更）
  - from: archive-in-progress
    to: discarded
    direction: skip
    countAs: none
    label: archive→discarded（废弃变更）

workflows:
  full:
    phases: [open, design, build, verify, archive-in-progress, archive-completed]
    phase_bps:
      open: [BP-1, BP-2, BP-3]
      design: [BP-4, BP-4.5, BP-5, BP-6, BP-7, BP-8]
      build: [BP-9, BP-10, BP-11, BP-12, BP-13]
      verify: [BP-14, BP-15, BP-16]
      archive-in-progress: [BP-17]
  hotfix:
    phases: [open, build, verify, archive-in-progress, archive-completed]
    skip_design: true
    phase_bps:
      open: [BP-3]
      build: [BP-18]
      verify: [BP-14, BP-16]
      archive-in-progress: [BP-17]
  tweak:
    phases: [open, build, verify, archive-in-progress, archive-completed]
    skip_design: true
    phase_bps:
      open: [BP-3]
      build: [BP-18]
      verify: [BP-14, BP-16]
      archive-in-progress: [BP-17]
  loop:
    # experimental：目前无 skill 消费者，仅供自改进 loop 通道内部使用，勿用于常规变更
    phases: [build, verify, archive-in-progress, archive-completed]
    phase_bps:
      build: [BP-9, BP-10, BP-11, BP-12, BP-13]
      verify: [BP-14, BP-15, BP-16]
      archive-in-progress: [BP-17]
