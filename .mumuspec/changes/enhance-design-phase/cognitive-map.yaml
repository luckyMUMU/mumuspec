entries:
  - quadrant: Q1
    category: persistent
    question: "设计阶段在 SDD 中的核心作用是什么?"
    answer: "将需求意图转化为可执行的技术规范，消除 AI 隐性假设，确保实现不漂移"
    confidence: high
    source: sd-theory

  - quadrant: Q1
    category: persistent
    question: "当前设计阶段最大的痛点是什么?"
    answer: "模板自由导致质量参差，无澄清循环，无质量检查，无一致性校验"
    confidence: high
    source: evaluation-report

  - quadrant: Q2
    status: pending
    question: "结构化模板是否会增加小变更的负担?"
    answer: "需要通过 tweak preset 轻量模板缓解"
    confidence: medium

  - quadrant: Q3
    status: confirmed
    question: "为什么不直接复制 GitHub Spec Kit 的模板?"
    answer: "Spec Kit 面向通用场景，MumuSpec 已有自己的 YAML 状态体系和 CLI，需整合而非照搬"
    confidence: high
    source: design-drill-down

  - quadrant: Q3
    status: confirmed
    question: "澄清循环为何独立成命令而非设计阶段内置?"
    answer: "保持阶段内聚性；clarify 是可选增强，不是强制流程"
    confidence: medium
    source: design-drill-down

  - quadrant: Q4
    category: blind-spot
    question: "AI 自审可能产生误报导致开发者频繁忽略警告?"
    answer: "需要分级机制（CRITICAL/MAJOR/MINOR），只有 CRITICAL 阻塞"
    confidence: medium
    source: risk-scan

  - quadrant: Q4
    category: blind-spot
    question: "一致性检查在大型项目中性能如何?"
    answer: "纯文本匹配复杂度 O(n*m)，可接受；未来可增量检查"
    confidence: low
    source: risk-scan
