    question: "Q3-002: Q1-004 → 评估器消费 validate 输出应复用 CLI 子进程模式而非内联 API"
    answer: "跟随 drift-score/spec-compliance 既有 spawn 模式（单一权威源），不自建第二解析通道"
    confidence: high
    source: "用户确认（BP-6，2026-09-14）"
    status: confirmed
  - quadrant: Q3
    category: reasoning
    question: "Q3-003: Q1-001 + Q1-002 → corpus 聚合结果须内嵌于 EvalReport 新维度而非改既有字段"
    answer: "EvalReport 扩展 corpusReports 数组，既有 total/passed/failed 语义不变——保护未知消费者"
    confidence: high
    source: "用户确认（BP-6，2026-09-14）"
    status: confirmed
  - quadrant: Q3
    category: reasoning
    question: "GM-001: build_layers 分层结构（report→evaluators→runner 单向依赖）"
    answer: "三层：L0 runner 层（corpus 分支 + custom 修复）/ L1 评估器层（verifiable-ratio + fail-open-count + registry）/ L2 消费层（eval --report + .eval-corpus 语料 + 验收单测）"
    confidence: high
    source: "grill-me 用户确认（BP-4.5，2026-09-14）"
    status: confirmed
  - quadrant: Q3
    category: reasoning
    question: "GM-002: corpus fixture 的 expected 声明形态"
    answer: "每 fixture 目录内 expected.yaml 声明 mustContain/mustNotContain 码清单与 kill 期望；runner 读取后与实跑信号 diff，不在共享配置集中声明"
    confidence: high
    source: "grill-me（lead 自查事实 + 探测 1 语料结构）"
    status: confirmed
  # ── Q4 盲区扫描 ──
  - quadrant: Q4
    category: blind-spot
    question: "Q4-001 隐藏耦合: corpus fixture 运行会触发 findProjectRoot 向上查找"
    answer: "fixture 子目录自身含 .mumuspec 即命中；但 fixture 嵌套在 .eval-corpus 下时 findProjectRoot 从 cwd 起查——runner 须显式传 projectRoot 绝对路径，不依赖 cwd 推断；兜底：单测断言无 cwd 依赖"
    confidence: medium
    source: "盲区扫描（隐藏耦合维度）"
  - quadrant: Q4
    category: blind-spot
    question: "Q4-002 测试盲区: Wilson CI 在 n=0（语料为空目录）时的除零"
    answer: "空 corpus 目录返回 nullResult（value 0 + details 说明），不抛异常；与 design-build-first-pass 的 nullResult 模式一致"
    confidence: high
    source: "盲区扫描（测试盲区维度）"
