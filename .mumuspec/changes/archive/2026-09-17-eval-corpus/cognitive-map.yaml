    answer: "M1 阶段 --report 为新增旗标，无既有消费者；JSON 形态自本版起冻结为事实契约，后续扩展只加字段不改性——写入 design 风险章节"
    confidence: medium
    source: "盲区扫描（契约兼容性维度）"
