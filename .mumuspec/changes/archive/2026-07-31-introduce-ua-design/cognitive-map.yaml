q4_unknown_unknowns:
  - id: Q4-001
    content: "Code Graph 适配器未安装时的降级体验：需明确告知用户降级后的能力边界"
    severity: medium
    mitigation: "CLI 输出警告 + 文档说明降级能力"

  - id: Q4-002
    content: "大型代码库（>10 万行）的 BFS 性能：3 跳 BFS 可能超时"
    severity: medium
    mitigation: "设置 max_nodes 上限（默认 1000），超出后截断并提示"

  - id: Q4-003
    content: "Knowledge-Impact 提交消息语法与 Conventional Commits 生态的兼容性"
    severity: low
    mitigation: "Knowledge-Impact 块放在消息尾部，不影响 Conventional Commits 解析"

  - id: Q4-004
    content: "onboarding 路径中 Knowledge Page 被删除或标记 deprecated 时的处理"
    severity: low
    mitigation: "跳过已废弃节点，在 UI 中标注「知识已过期」"

  - id: Q4-005
    content: "多用户同时修改同一 Knowledge Page 时的冲突（极少见但可能）"
    severity: low
    mitigation: "使用文件锁或 git merge 策略处理"
