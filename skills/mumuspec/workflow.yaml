# MumuSpec Skill Dispatch Configuration
# 编排器与各阶段 Skill 的分发规则（整合版）
# 参考: docs/reference/skills/ 详细设计规范

version: 0.12.2
workflow:
  # 编排器入口
  orchestrator:
    name: mumuspec
    description: "MumuSpec 工作流编排器（grill me 风格一站式入口）"
    entry: phase-open
    dispatch:
      # Step 0: 预设检测（最高优先级）
      - condition: "user_intent == 'hotfix' AND meets_hotfix_criteria"
        target: workflow-presets
        preset: hotfix
      - condition: "user_intent == 'tweak' AND meets_tweak_criteria"
        target: workflow-presets
        preset: tweak
      # Step 1-3: 阶段检测
      - condition: "no_active_change"
        target: phase-open
      - condition: "phase == 'open'"
        target: phase-open
      - condition: "phase == 'design'"
        target: phase-design
      - condition: "phase == 'build'"
        target: phase-build
      - condition: "phase == 'verify'"
        target: phase-verify
      - condition: "phase == 'archive-in-progress'"
        target: phase-archive

  # ──────────────────────────────────────────────────────────────────────
  # 有向有环图（Directed Cyclic Graph）定义
  # ──────────────────────────────────────────────────────────────────────
  # 底层状态机从简单的线性流转改为有向有环图（DCG）。
  #
  # 图的节点 = 工作流阶段（ChangePhase）
  # 图的边 = 阶段转换（PhaseEdge）
  #
  # 边类型:
  #   - forward: 正向推进向归档完成
  #   - backward: 回退 / 返工（形成环的关键）
  #   - skip: 条件跳过（hotfix/tweak 预设路径）
  #
  # 图的环结构（显式允许）:
  #   open → design → build → design (rollback)
  #   open → design → build → verify → design (rollback)
  #   open → design → build → verify → build (rebuild)
  #   open → design → build → verify → archive-in-progress → build (CI fail)
  graph:
    nodes:
      - open
      - design
      - build
      - verify
      - archive-in-progress
      - archive-completed  # terminal
      - discarded          # terminal

    edges:
      # ── Forward edges (progress toward completion) ──
      - from: open
        to: design
        direction: forward
        blocking_point: { bp: BP-3, description: "工件审查与确认", required: true }

      - from: design
        to: build
        direction: forward
        blocking_point: { bp: BP-4, description: "设计方案确认", required: true }

      - from: build
        to: verify
        direction: forward

      - from: verify
        to: archive-in-progress
        direction: forward
        blocking_point: { bp: BP-17, description: "归档最终确认", required: true }

      - from: archive-in-progress
        to: archive-completed
        direction: forward

      # ── Skip edges (conditional shortcuts for hotfix/tweak) ──
      - from: open
        to: build
        direction: skip
        condition: "workflow == 'hotfix' OR workflow == 'tweak'"
        blocking_point: { bp: BP-3, description: "工件审查与确认（预设路径）", required: true }

      # ── Backward edges (rollback — these create cycles) ──
      - from: build
        to: design
        direction: backward
        count_as: rollback

      - from: verify
        to: design
        direction: backward
        count_as: rollback

      - from: verify
        to: build
        direction: backward
        count_as: rebuild

      - from: archive-in-progress
        to: build
        direction: backward
        count_as: rollback

      # ── Terminal edges (abandon change) ──
      - from: open
        to: discarded
        direction: skip
      - from: design
        to: discarded
        direction: skip
      - from: build
        to: discarded
        direction: skip
      - from: verify
        to: discarded
        direction: skip
      - from: archive-in-progress
        to: discarded
        direction: skip

  # 阶段 Skill 定义（与 docs/reference/skills/ 对齐）
  phases:
    open:
      name: phase-open
      description: "MumuSpec Phase 1: Open。需求探索、变更创建、worktree 隔离"
      full_description: "探索需求、创建变更工件、影响分析、知识加载、worktree 隔离"
      phase_key: open
      commands:
        - mumuspec new
        - mumuspec context
        - mumuspec add-spec
        - mumuspec state init
        - mumuspec state check
      required_skills:
        - brainstorming (required)
        - gitnexus-impact-analysis (required)
        - using-git-worktrees (required)
      blocking_points:
        - BP-1: 需求澄清完成确认
        - BP-2: PRD 拆分决策
        - BP-3: 工件审查与确认
      on_enter:
        - 确认输出语言规则
        - 加载 brainstorming skill
        - 需求探索与澄清（多轮）
      on_exit:
        - 运行 mumuspec guard <name> design --apply   # <phase> = 目标阶段（离开 open）
        - 验证 proposal.md 存在且非空 (E-GUARD-001)
        - 验证 decisions.md content_hash 匹配 (E-CHANGE-007)
        - 用户必须确认 (BP-3)

    design:
      name: phase-design
      description: "MumuSpec Phase 2: Design。认知框架 Q1-Q4 + Hyperplan + 测试锁定"
      full_description: "认知框架 Q1-Q4 + 自顶向下逐层设计 + Hyperplan 对抗审查 + 测试用例锁定"
      phase_key: design
      commands:
        - mumuspec knowledge context
        - mumuspec cognitive-map
        - mumuspec test-cases
        - mumuspec state check
      required_skills:
        - gitnexus-exploring (Q1, required)
        - brainstorming (Q2/Q3, required)
        - hyperplan (BP-7, conditional)
      blocking_points:
        - BP-4: 设计方案确认
        - BP-5: 认知框架 Q2 回答
        - BP-6: 认知框架 Q3 确认
        - BP-7: Hyperplan 开放问题解决
        - BP-8: 测试用例锁定确认
      on_enter:
        - Stage 1: Q1 信息采集
        - Stage 2: Q2 探索激活
        - Stage 3: Q3 推理 + Q4 扫描
        - Stage 4: 设计生成
      on_exit:
        - 运行 mumuspec guard <name> build --apply   # <phase> = 目标阶段（离开 design）
        - 锁定 test-cases (design_locked: true)
        - 计算 design_content_hash
        - I1 设计覆盖无断链（state.design_coverage，E-GUARD-009 / W-GUARD-009）
        - 认知框架必须收敛
        - 用户必须确认 (BP-4)

    build:
      name: phase-build
      description: "MumuSpec Phase 3: Build。TDD 实现 + Ponytail 合规检查"
      full_description: "自下向上实现 + 红绿 TDD + Ponytail 合规检查 + 代码图谱增量更新"
      phase_key: build
      commands:
        - mumuspec check
        - mumuspec drift
        - mumuspec test-cases
        - mumuspec state check
        - mumuspec guard
      required_skills:
        - writing-plans (required)
        - test-driven-development (required, tdd_mode per config)
        - systematic-debugging (on failure)
      optional_skills:
        - executing-plans
        - subagent-driven-development
        - requesting-code-review
      blocking_points:
        - BP-9: 计划就绪暂停选择
        - BP-10: 工作区隔离 + 执行方式选择
        - BP-11: 分支命名确认
        - BP-12: 规范增量更新（中型）
        - BP-13: 范围扩展拆分决策
      on_enter:
        - 确认 tdd_mode 与配置一致 (default_tdd_mode)
        - 加载 writing-plans skill
        - 创建 tasks.md (自底向上排序)
        - 选择 isolation/build_mode (BP-10)
      on_exit:
        - 运行 mumuspec guard <name> verify --apply   # <phase> = 目标阶段（离开 build）
        - 所有 build_layers 完成 (status = done)
        - 同层 scope 无直接调用边 (W-BUILD-001)
        - Ponytail 合规检查通过（mumuspec check，非守卫项）
        - 代码审查已执行（或记录跳过）
        - tests suites locked + hash 匹配

    verify:
      name: phase-verify
      description: "MumuSpec Phase 4: Verify。规范校验 + 漂移检测 + 分支处理"
      full_description: "规范校验 + 漂移检测 + 测试不可变性验证 + 分支处理"
      phase_key: verify
      commands:
        - mumuspec check
        - mumuspec drift
        - mumuspec test-cases verify
        - mumuspec validate
        - mumuspec graph verify
        - mumuspec contract verify
      required_skills:
        - verification-before-completion (required)
        - finishing-a-development-branch (BP-16, required)
      blocking_points:
        - BP-14: 验证失败修复/接受偏差
        - BP-15: Spec 漂移处理
        - BP-16: 分支处理方式选择
      on_enter:
        - 规模评估 (light vs full)
        - 加载 verification-before-completion skill
        - 运行规范一致性校验
      on_exit:
        - 运行 mumuspec guard <name> archive-in-progress --apply   # <phase> = 目标阶段（离开 verify）
        - verify_result: pass
        - verification_report 已记录
        - branch_status: handled
        - 所有 drift 已处理（mumuspec drift，非守卫项）

    archive:
      name: phase-archive
      description: "MumuSpec Phase 5: Archive。Git 合并 + 规范归档 + 知识提取"
      full_description: "Git 合并 + 规范归档 + 知识提取 + 清理收尾"
      phase_key: archive
      commands:
        - mumuspec archive
      required_skills:
        - finishing-a-development-branch
        - ci-cd-and-automation
        - documentation-and-adrs
      blocking_points:
        - BP-17: 归档最终确认
      on_enter:
        - 验证 verify_result == pass
        - 验证 branch_status == handled
        - 用户确认归档操作 (BP-17)
      on_exit:
        - 运行 mumuspec archive <name>
        - git_merge.merged: true
        - delta-specs 合并到主规范
        - 知识提取完成 (D1-D8)
        - 变更移动到 archive/
        - worktree 清理

  # 预设路径定义
  presets:
    hotfix:
      name: hotfix
      description: "预设路径: Bug 修复。open → build → verify → archive（跳过 Design）"
      phases: [open, build, verify, archive]
      guard_open_to_build: open_to_build_hotfix
      defaults:
        build_mode: direct
        tdd_mode: tdd
      required_artifacts:
        - proposal.md
        - test-cases/layer-0-cases.md
        - suite-map.yaml
      upgrade_conditions:
        - 变更涉及 3+ 文件
        - 架构变更
        - 数据库 schema 变更
        - 引入新公共 API
        - 修复范围超出单个函数/模块
        - 涉及新增 SHALL NOT
      blocking_points:
        - BP-3: 工件审查确认（简化版）
        - BP-14: 验证失败决策
        - BP-16: 分支处理选择
        - BP-17: 归档最终确认
        - BP-18: 升级条件触发确认
      additional_steps:
        - 根因消除检查
      skip_steps:
        - brainstorming
        - cognitive_framework
        - hyperplan
        - delta-specs (通常)

    tweak:
      name: tweak
      description: "预设路径: 小变更。open → lightweight build → light verify → archive"
      phases: [open, build, verify, archive]
      guard_open_to_build: open_to_build_tweak
      defaults:
        build_mode: direct
        isolation: branch
        tdd_mode: tdd
        verify_mode: light
      required_artifacts:
        - proposal.md
        - tasks.md (预填)
        - test-cases/layer-0-cases.md
        - suite-map.yaml
      upgrade_conditions:
        - 变更涉及 5+ 文件
        - 跨模块协调
        - 5+ 新测试用例
        - 配置项增删（非值修改）
        - 新增能力需求
        - 需要 delta spec
        - 涉及新增 SHALL NOT
      blocking_points:
        - BP-3: 工件审查确认（极简版）
        - BP-14: 验证失败决策
        - BP-16: 分支处理选择
        - BP-17: 归档最终确认
        - BP-18: 升级条件触发确认
      skip_steps:
        - brainstorming
        - cognitive_framework
        - hyperplan
        - delta-specs
        - constraints
        - impact-analysis
        - knowledge_extraction (archive)

  # 横切关注点
  cross_cutting:
    - name: ponytail
      description: "Ponytail 编码约束检查（7 级优先级阶梯）"
      applies_to: [build, verify]
      command: mumuspec check --ponytail
      enforcement_levels:
        - level_1: YAGNI (WARN)
        - level_3: 标准库优先 (ERROR)
        - level_6: 一行代码 (WARN)
        - level_7: 最小实现 (WARN)

    - name: drift_detection
      description: "漂移检测（MumuSpec 独有）"
      applies_to: [verify, archive]
      command: mumuspec drift
      drift_types:
        - spec_drift
        - graph_drift
        - test_immutability_drift
        - design_doc_drift
        - contract_drift
        - knowledge_drift
        - ponytail_drift

    - name: audit
      description: "审计日志"
      applies_to: [all]
      command: mumuspec audit-log

    - name: test_immutability
      description: "测试不可变性保障"
      applies_to: [build, verify]
      enforcement: design_locked 后测试不可变更

    - name: cognitive_framework
      description: "认知框架 Q1-Q4（MumuSpec 独有）"
      applies_to: [design]
      convergence_criteria:
        - rounds_completed <= 5
        - q2_pending == 0 or rounds >= 5
        - q3_pending == 0 or rounds >= 5
        - q4_scans_completed >= 3
        - converged: true

    - name: knowledge_management
      description: "知识层管理（MumuSpec 独有）"
      applies_to: [open, archive]
      open_actions:
        - 加载历史知识 (rationale / decision / risk)
        - 新鲜度检查
      archive_actions:
        - D1-D8 知识提取流程
        - 更新 PageIndex

  # Phase Guard 检查项汇总（与 phase-guard.ts 实现对齐）
  guards:
    open_to_design:
      - proposal.md exists and non-empty
      - delta-specs/ has at least one spec file
      - affected_scopes defined
      - code-graph/impact-analysis.json exists
      - single_active_change: true
      - worktree_created: true
      - brainstorming_completed: true
      - knowledge_context_loaded: true

    open_to_build_hotfix:
      - proposal.md exists
      - workflow == hotfix
      - build_layers defined
      - test-cases/ exists
      - test_cases.design_locked: true
      - tdd_mode matches default_tdd_mode

    open_to_build_tweak:
      - proposal.md exists
      - workflow == tweak
      - tasks.md exists
      - test-cases/layer-0-cases.md exists
      - test_cases.design_locked: true
      - tdd_mode matches default_tdd_mode

    design_to_build:
      - design.md exists and non-empty
      - constraints/ exists
      - build_layers defined
      - test_cases.design_locked: true
      - test_cases.design_content_hash matches
      - tdd_mode matches default_tdd_mode
      - cognitive_framework收敛 (若 enabled)

    build_to_verify:
      - all tasks.md items checked
      - build_layers all status = done
      - test_cases.design_locked: true
      - test_cases.suites_locked: true
      - all test suites passed

    verify_to_archive:
      - verify_result: pass
      - verify.md exists with report
      - all SHALL/SHALL NOT enforcements passed
      - no critical drift
      - test_immutability_verified: true

    archive_complete:
      - git_merge.merged: true
      - delta-specs merged to main specs
      - knowledge_extraction_completed: true
      - change moved to archive/
      - worktree cleaned up
