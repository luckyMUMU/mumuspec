# Cognitive Map Template —乔哈里窗变体
# 这是 guard 校验接受的唯一格式。请勿使用 q1_anchors/q2_questions 等独立字段。
#
# 使用方式：
#   1. 复制此文件到 .mumuspec/changes/<name>/cognitive-map.yaml
#   2. 根据变更需求填入 entries
#   3. 运行 mumuspec guard 校验
#
# 字段规范：
#   quadrant: Q1 | Q2 | Q3 | Q4
#   category: known-known | known-unknown | reasoning | blind-spot | persistent
#   question: 问题描述（Q1 可省略，作为锚点声明）
#   answer: 答案/结论
#   confidence: high | medium | low
#   source: 信息来源
#   status（Q3 专用）: confirmed | rejected | modified
#   options（Q2 专用）: 候选项列表

entries:
  # ═══════════════════════════════════════════
  # Q1: Known Knowns —确定的事实（锚定基线）
  # category: known-known 或 persistent
  # ═══════════════════════════════════════════
  - quadrant: Q1
    category: known-known
    question: "【填写】已知的确定事实？"
    answer: "【填写】答案"
    confidence: high
    source: "【填写】来源文件/知识页"

  # ═══════════════════════════════════════════
  # Q2: Known Unknowns —需要探索的问题
  # category: known-unknown
  # ═══════════════════════════════════════════
  - quadrant: Q2
    category: known-unknown
    question: "【填写】需要回答的设计问题？"
    options:
      - "选项 A"
      - "选项 B"
      - "不确定"
    answer: "【填写】用户选择的答案"
    confidence: high
    source: "user-confirmed"

  # ═══════════════════════════════════════════
  # Q3: Reasoning —基于 Q1 的推导
  # category: reasoning, status: confirmed/rejected/modified
  # ═══════════════════════════════════════════
  - quadrant: Q3
    category: reasoning
    status: confirmed
    question: "【填写】推导出的设计约束？"
    answer: "【填写】结论与推导依据"
    confidence: high
    source: "design-drill-down"

  # ═══════════════════════════════════════════
  # Q4: Blind Spots —扫描的盲区
  # category: blind-spot
  # ═══════════════════════════════════════════
  - quadrant: Q4
    category: blind-spot
    question: "【填写】扫描维度（如：并发安全/契约兼容性/错误处理）？"
    answer: "【填写】扫描结论"
    confidence: medium
    source: "risk-scan"
